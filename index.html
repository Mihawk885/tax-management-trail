<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearTax - Practice Dashboard</title>
  <style>
    :root {
      --ink: #17251f;
      --muted: #69766f;
      --green: #1d6b4b;
      --green-dark: #155239;
      --green-light: #dcebe3;
      --cream: #f5f2e9;
      --white: #ffffff;
      --line: #dde4df;
      --gold: #d9ad63;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    .shell {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh;
    }

    aside {
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      background: var(--white);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 44px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      background: var(--green);
    }

    nav { display: grid; gap: 8px; }

    nav button {
      border: 0;
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    nav button.active {
      color: var(--green);
      background: var(--green-light);
    }

    .profile {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .profile strong {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 3px;
    }

    main {
      padding: 38px 44px 48px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .year {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      background: var(--white);
      color: var(--muted);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.05fr) minmax(360px, 1.55fr);
      gap: 22px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 12px 35px rgba(23, 37, 31, 0.06);
    }

    .summary {
      min-height: 330px;
      padding: 28px;
      color: var(--white);
      background: var(--green);
      border: 0;
      position: relative;
      overflow: hidden;
    }

    .summary::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -100px;
      bottom: -130px;
      border: 34px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .summary-label {
      color: #cfe0d6;
      font-size: 13px;
    }

    .summary-value {
      margin: 12px 0 28px;
      font-family: Georgia, serif;
      font-size: 52px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
    }

    .summary-row span:last-child { font-weight: 800; }

    .calculator {
      padding: 26px;
    }

    .calculator h2 {
      margin: 0 0 22px;
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fbfcfb;
      font: inherit;
      font-weight: 700;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-light);
    }

    .calculate {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      color: var(--white);
      background: var(--green);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: 150ms ease;
    }

    .calculate:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .activity {
      grid-column: 1 / -1;
      padding: 24px 28px;
    }

    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .activity h2 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .status {
      border-radius: 99px;
      padding: 7px 10px;
      color: var(--green);
      background: var(--green-light);
      font-size: 12px;
      font-weight: 800;
    }

    .activity-line {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      background: var(--green-light);
    }

    .activity-line strong { display: block; margin-bottom: 3px; }
    .activity-line small { color: var(--muted); }
    .amount { font-weight: 800; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 78px 1fr; }
      aside { padding: 24px 14px; }
      .brand { justify-content: center; }
      .brand span:last-child,
      nav button span,
      .profile { display: none; }
      nav button { text-align: center; }
      main { padding: 30px 24px; }
      .grid { grid-template-columns: 1fr; }
      .activity { grid-column: auto; }
    }

    @media (max-width: 600px) {
      .shell { display: block; }
      aside { display: none; }
      main { padding: 24px 16px; }
      header { align-items: flex-end; }
      .year { display: none; }
      .fields { grid-template-columns: 1fr; }
      .summary-value { font-size: 44px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <span class="brand-mark">$</span>
        <span>ClearTax</span>
      </div>
      <nav aria-label="Main navigation">
        <button class="active"><span>Overview</span></button>
        <button><span>Income</span></button>
        <button><span>Deductions</span></button>
        <button><span>Documents</span></button>
      </nav>
      <div class="profile">
        <strong>Practice Account</strong>
        tax year 2026
      </div>
    </aside>

    <main>
      <header>
        <div>
          <p class="eyebrow">Tax overview</p>
          <h1>Good morning</h1>
        </div>
        <div class="year">2026 tax year</div>
      </header>

      <section class="grid">
        <article class="card summary">
          <div class="summary-label">Estimated tax refund</div>
          <div class="summary-value" id="refund">$0</div>
          <div class="summary-row">
            <span>Taxable income</span>
            <span id="taxable">$0</span>
          </div>
          <div class="summary-row">
            <span>Estimated tax</span>
            <span id="tax">$0</span>
          </div>
        </article>

        <article class="card calculator">
          <h2>Quick calculator</h2>
          <div class="fields">
            <label>
              Annual income
              <input id="income" type="number" min="0" value="75000" placeholder="75000">
            </label>
            <label>
              Tax already paid
              <input id="paid" type="number" min="0" value="12000" placeholder="12000">
            </label>
            <label>
              Deductions
              <input id="deductions" type="number" min="0" value="15000" placeholder="15000">
            </label>
            <label>
              Filing status
              <input value="Single" disabled>
            </label>
          </div>
          <button class="calculate" id="calculate" type="button">Calculate estimate</button>
        </article>

        <article class="card activity">
          <div class="activity-head">
            <h2>Recent activity</h2>
            <span class="status">On track</span>
          </div>
          <div class="activity-line">
            <div class="icon">1</div>
            <div>
              <strong>Income information</strong>
              <small>Updated today</small>
            </div>
            <div class="amount" id="incomeAmount">$75,000</div>
          </div>
          <div class="activity-line">
            <div class="icon">2</div>
            <div>
              <strong>Tax documents</strong>
              <small>2 of 3 received</small>
            </div>
            <div class="amount">67%</div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script>
    const money = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    });

    function calculate() {
      const income = Math.max(0, Number(document.getElementById("income").value) || 0);
      const paid = Math.max(0, Number(document.getElementById("paid").value) || 0);
      const deductions = Math.max(0, Number(document.getElementById("deductions").value) || 0);
      const taxable = Math.max(0, income - deductions);

      let tax = 0;
      if (taxable > 609350) {
        tax = 109587.5 + (taxable - 609350) * 0.37;
      } else if (taxable > 225000) {
        tax = 52569.5 + (taxable - 225000) * 0.35;
      } else if (taxable > 104000) {
        tax = 19970.5 + (taxable - 104000) * 0.24;
      } else if (taxable > 48300) {
        tax = 5576 + (taxable - 48300) * 0.22;
      } else if (taxable > 11800) {
        tax = 1180 + (taxable - 11800) * 0.12;
      } else {
        tax = taxable * 0.10;
      }

      tax = Math.round(tax);
      const refund = paid - tax;

      document.getElementById("taxable").textContent = money.format(taxable);
      document.getElementById("tax").textContent = money.format(tax);
      document.getElementById("refund").textContent =
        refund >= 0 ? money.format(refund) : "-" + money.format(Math.abs(refund));
      document.getElementById("incomeAmount").textContent = money.format(income);
    }

    document.getElementById("calculate").addEventListener("click", calculate);
    calculate();
  </script>
</body>
</html>
